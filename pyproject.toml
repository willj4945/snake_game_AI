[project]
name = "snake-game-ai"
version = "0.1.0"
description = "A Snake game played by a Deep Q-Learning agent (PyTorch + Pygame)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9",
    "matplotlib>=3.10",
    "numpy>=2",
    "pygame>=2.6",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "pip-audit>=2.9",
    "pytest>=8",
]

[tool.uv]
# This is an application run as scripts, not an installable package.
package = false

# CPU-only torch: the model is tiny and the code never uses CUDA.
# `explicit = true` means only packages listed in [tool.uv.sources] come from this index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B311: `random` is used for gameplay and exploration, not cryptography.
skips = ["B311"]
